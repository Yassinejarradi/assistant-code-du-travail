name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The tests don't load any model: only the lightweight dependencies are needed.
      - run: pip install pytest ollama rank-bm25 snowballstemmer
      - run: pytest -v
